name: Bug report
description: Report a reproducible problem in Collab IDE.
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Never include passwords, tokens, private workspace content, or other sensitive data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: Describe the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable sequence of steps.
      placeholder: |
        1. Open ...
        2. Choose ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Authentication
        - Workspace / file explorer
        - Editor / collaboration
        - Invitations / permissions
        - Terminal / execution
        - Recording / replay
        - Deployment / infrastructure
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, deployment type, and commit/version if known.
      placeholder: Windows 11, Edge 157, local Docker Compose
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact secrets and personal data before sharing.
      render: text
    validations:
      required: false
